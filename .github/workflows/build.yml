name: Build Dolby Tuner APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
      - name: Setup Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          for CT in "$SDK_ROOT"/cmdline-tools/*/bin/sdkmanager; do
            if [ -x "$CT" ]; then
              yes | "$CT" --licenses >/dev/null 2>&1 || true
              yes | "$CT" "platforms;android-37" "build-tools;35.0.0" >/dev/null 2>&1 || true
            fi
          done
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6.3.0
        with:
          validate-wrappers: false
      - name: Build Debug + R8 Release
        run: sh gradlew assembleDebug assembleRelease --stacktrace
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DolbyTuner-debug
          path: app/build/outputs/apk/debug/*.apk
      - name: Upload R8 APK
        uses: actions/upload-artifact@v4
        with:
          name: DolbyTuner-r8
          path: app/build/outputs/apk/release/*.apk
      - name: Upload mapping
        uses: actions/upload-artifact@v4
        with:
          name: DolbyTuner-mapping
          path: app/build/outputs/mapping/release/mapping.txt
